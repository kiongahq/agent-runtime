name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@1d0892d30e49997b7a082766e23d15ffb6ed5c1b
    with:
      install: pip install -r requirements-dev.txt
  image:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@1d0892d30e49997b7a082766e23d15ffb6ed5c1b
    permissions: {contents: read, packages: write}
    with: {image: agent-runtime}
  langflow-image:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@1d0892d30e49997b7a082766e23d15ffb6ed5c1b
    permissions: {contents: read, packages: write}
    with:
      image: langflow-agent-runtime
      build-args: RUNTIME_FLAVOR=langflow
  langflow-smoke:
    if: github.event_name != 'pull_request'
    needs: langflow-image
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute exported echo flow with LFX
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/kiongahq/langflow-agent-runtime:sha-${GITHUB_SHA::7}"
          docker pull "$image"
          docker run --rm --entrypoint python "$image" -c \
            'from agent_runtime.langflow_components.kionga.resources import KiongaKnowledgeSearch, KiongaAPIInvoke, KiongaChatAPI, KiongaDatasets, KiongaDatasetObjects, KiongaDatasetText, KiongaRegisteredStorage, KiongaRegisteredObjects, KiongaRegisteredObjectText, chat_completion_text; assert all(node.name for node in (KiongaKnowledgeSearch, KiongaAPIInvoke, KiongaChatAPI, KiongaDatasets, KiongaDatasetObjects, KiongaDatasetText, KiongaRegisteredStorage, KiongaRegisteredObjects, KiongaRegisteredObjectText)); assert chat_completion_text({"choices": [{"message": {"content": "ok"}}]}) == "ok"'
          docker run --rm --entrypoint lfx \
            -v "$PWD/tests/fixtures:/flows:ro" "$image" \
            run /flows/echo-flow.json --input-value 'Kionga smoke response' --format json --timing \
            | tee /tmp/kionga-lfx-smoke.json
          grep -q 'Kionga smoke response' /tmp/kionga-lfx-smoke.json
          docker run --rm --entrypoint python \
            -v "$PWD/tests/fixtures:/flows:ro" \
            -e KIONGA_LANGFLOW_FLOW_PATH=/flows/echo-flow.json "$image" -c \
            'import asyncio; from langchain_core.messages import HumanMessage; from agents.langflow_adapter import build_langflow; result = asyncio.run(build_langflow().ainvoke({"messages": [HumanMessage(content="Kionga adapter response")]}, config={"configurable": {"thread_id": "smoke-session"}})); assert "Kionga adapter response" in result["messages"][-1].content'
